@if(!databaseAvailable()) {
Select a database
} @else {
<div class="toolbar">
    <button (click)="add()">+</button>
</div>
<ag-grid-angular [rowData]="rowData" [columnDefs]="colDefs" [rowSelection]="rowSelection"
    (selectionChanged)="onSelectionChanged($event)" (cellDoubleClicked)="onCellDoubleClicked($event)" />

@if(details){
<div class="details">
    <h3>Production</h3>
    <span class="main">{{details.production.total}}</span>
    <span class="percent pv">{{details.production.pv}}</span>
    <span class="percent grid">{{details.production.grid}}</span>
    <h3>Consumption</h3>
    <span class="main">{{details.consumption.total}}</span>
    <span class="percent pv">{{details.consumption.pv}}</span>
    <span class="percent grid">{{details.consumption.grid}}</span>


</div> }
}

<dialog #row>

    <form class="rowData" [formGroup]="rowDataForm" (ngSubmit)="rowSubmit()">
        <label>
            year
            <input #first type="number" formControlName="year">
        </label>
        <label>
            month
            <input type="number" formControlName="month">
        </label>
        <label>
            generatedByPV
            <input type="number" formControlName="generatedByPV">
        </label>
        <label>
            consumedByAppliances
            <input type="number" formControlName="consumedByAppliances">
        </label>
        <label>
            fedToGrid
            <input type="number" formControlName="fedToGrid">
        </label>
        <label>
            consuptionCoverageByPV
            <input type="number" formControlName="consuptionCoverageByPV">
        </label>

        <button [disabled]="rowDataForm.invalid">Submit</button>
    </form>
</dialog>
